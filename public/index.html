  <script>
    // Hold-to-skip functionality
    let holdTimer = null;
    let holdStartTime = 0;
    let progressInterval = null;
    const HOLD_DURATION = 3000; // 3 seconds

    function initHoldToSkip() {
      const biosWrapper = document.querySelector('.BIOSWrapper');
      const progressContainer = document.createElement('div');
      const progressBar = document.createElement('div');
      const hintText = document.createElement('div');

      progressContainer.className = 'hold-progress-container';
      progressBar.className = 'hold-progress-bar';
      hintText.className = 'hold-hint';
      hintText.textContent = 'Hold to skip BIOS';

      progressContainer.appendChild(progressBar);
      biosWrapper.appendChild(progressContainer);
      biosWrapper.appendChild(hintText);

      function startHold() {
        holdStartTime = Date.now();
        progressContainer.classList.add('visible');
        hintText.classList.add('visible');

        holdTimer = setTimeout(() => {
          // Skip BIOS with fade transition
          clearProgressUpdater();
          windowsLogo();
        }, HOLD_DURATION);

        // Update progress bar
        progressInterval = setInterval(() => {
          const elapsed = Date.now() - holdStartTime;
          const progress = Math.min((elapsed / HOLD_DURATION) * 100, 100);
          progressBar.style.width = progress + '%';
        }, 50);
      }

      function ensureProperStructure() {
        const checkDesktop = setInterval(() => {
          const desktop = document.querySelector('.desktop');
          const biosWrapper = document.querySelector('.BIOSWrapper');
          const windowsWrapper = document.querySelector('.WindowsLaunchWrapper');

          if (desktop) {
            clearInterval(checkDesktop);

            // Move wrappers inside desktop if not already there
            if (biosWrapper && biosWrapper.parentElement !== desktop) {
              desktop.appendChild(biosWrapper);
            }

            if (windowsWrapper && windowsWrapper.parentElement !== desktop) {
              desktop.appendChild(windowsWrapper);
            }

            // Ensure desktop is positioning context
            desktop.style.position = 'relative';
          }
        }, 100);
      }

      // Initialize when ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ensureProperStructure);
      } else {
        ensureProperStructure();
      }

      function clearProgressUpdater() {
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
      }

      function endHold() {
        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }
        clearProgressUpdater();

        progressContainer.classList.remove('visible');
        hintText.classList.remove('visible');
        progressBar.style.width = '0%';
      }

      // Mouse events
      biosWrapper.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startHold();
      });

      biosWrapper.addEventListener('mouseup', endHold);
      biosWrapper.addEventListener('mouseleave', endHold);

      // Touch events
      biosWrapper.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startHold();
      });

      biosWrapper.addEventListener('touchend', endHold);
      biosWrapper.addEventListener('touchcancel', endHold);

      // Keyboard events (spacebar or enter)
      document.addEventListener('keydown', (e) => {
        if ((e.code === 'Space' || e.code === 'Enter') && !holdTimer && !biosWrapper.classList.contains('hidden')) {
          e.preventDefault();
          startHold();
        }
      });

      document.addEventListener('keyup', (e) => {
        if ((e.code === 'Space' || e.code === 'Enter') && holdTimer) {
          e.preventDefault();
          endHold();
        }
      });
    }

    // --- Utility: System Environment BIOS Fields as in screenshot ---
    function headerLine(text, totalWidth = window.innerWidth <= 768 ? 45 : 54) {
      const pad = Math.floor((totalWidth - text.length) / 2);
      return " ".repeat(Math.max(0, pad)) + text;
    }

    function formatLine(label, value, totalWidth = window.innerWidth <= 768 ? 45 : 54) {
      label = label ?? '';
      value = value == null ? '' : String(value);
      const maxValueLength = totalWidth - label.length - 3;
      if (value.length > maxValueLength) {
        value = value.slice(0, maxValueLength);
      }
      const dotsCount = totalWidth - label.length - value.length;
      const dots = '.'.repeat(Math.max(1, dotsCount));
      const result = (label + dots + value).slice(0, totalWidth);
      return result.padEnd(totalWidth, ' ');
    }

    function shortenAppVersion(version) {
      if (!version) return "";
      const match = version.match(/(\d+\.\d+).*?(Windows NT \d+\.\d+|Mac OS X|Linux|iPhone OS|iPad OS).*?(Win64|x64|Intel|ARM)?/i);
      if (match) {
        const arch = match[3] ? ` ${match[3]}` : '';
        return `${match[1]} ${match[2]}${arch}`;
      }
      return version.substring(0, 40);
    }

    function shortenUserAgent(userAgent) {
      const chromeMatch = userAgent.match(/Chrome\/(\d+\.\d+\.\d+)/);
      const safariMatch = userAgent.match(/Safari\/(\d+\.\d+)/);
      const firefoxMatch = userAgent.match(/Firefox\/(\d+\.\d+)/);
      const webkitMatch = userAgent.match(/AppleWebKit\/(\d+\.\d+)/);

      if (chromeMatch) {
        const webkit = webkitMatch ? ` WebKit/${webkitMatch[1]}` : '';
        return `Chrome ${chromeMatch[1]}${webkit}`;
      }
      if (firefoxMatch) {
        const gecko = userAgent.includes('Gecko') ? ' Gecko' : '';
        return `Firefox ${firefoxMatch[1]}${gecko}`;
      }
      if (safariMatch) {
        const webkit = webkitMatch ? ` WebKit/${webkitMatch[1]}` : '';
        return `Safari ${safariMatch[1]}${webkit}`;
      }
      return userAgent.substring(0, 45);
    }

    function getSystemFields() {
      const nav = window.navigator;
      const loc = window.location;
      const TOTAL_WIDTH = window.innerWidth <= 768 ? 45 : 54;
      const SEP = '='.repeat(TOTAL_WIDTH);

      const jsEnabled = typeof Symbol === "function" ? "Enabled" : "Unknown";
      const cssGridSupport = (window.CSS && CSS.supports("display", "grid")) ? "Grid: Yes" : "Grid: No";

      let batteryStatus = "N/A";
      if (navigator.getBattery) {
        navigator.getBattery().then(battery => {
          batteryStatus = `${Math.round(battery.level * 100)}% ` + (battery.charging ? "(Plugged In)" : "(On Battery)");
        });
      }

      function getInputPeripherals() {
        let peripherals = [];
        if ('ontouchstart' in window || nav.maxTouchPoints > 0) peripherals.push('Touch');
        if (window.matchMedia('(pointer:fine)').matches) peripherals.push('Mouse');
        return peripherals.length ? peripherals.join(", ") : "None";
      }

      let linkSpeed = "N/A";
      let netType = "N/A";
      if (nav.connection) {
        linkSpeed = nav.connection.downlink ? `${nav.connection.downlink} Mbps` : "Unknown";
        netType = nav.connection.effectiveType ? nav.connection.effectiveType.toUpperCase() : "Unknown";
      }

      let graphicsAdapter = "N/A";
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const ext = gl.getExtension('WEBGL_debug_renderer_info');
          if (ext) {
            graphicsAdapter = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch { }

      function getSoundDeviceStatus() {
        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
          navigator.mediaDevices.enumerateDevices().then(devices => {
            return devices.some(d => d.kind === "audiooutput") ? "Yes" : "No";
          });
        }
        return "Check";
      }

      return [
        SEP,
        headerLine("*** SYSTEM & SESSION INFO ***"),
        formatLine("App Version", "0.9.8 Beta"),
        formatLine("Shell Environment", nav.appName),
        formatLine("Core Engine", nav.appCodeName),
        formatLine("Boot Agent", shortenUserAgent(nav.userAgent)),
        formatLine("Cookies", nav.cookieEnabled ? "Enabled" : "Disabled"),
        formatLine("Language", nav.language),
        formatLine("JavaScript", jsEnabled),
        formatLine("CSS Engine Version", cssGridSupport),
        formatLine("Local Time", new Date().toLocaleString()),
        SEP,
        headerLine("*** HARDWARE & DEVICE ***"),
        formatLine("Display Adapter", `${window.screen.width} x ${window.screen.height}px`),
        formatLine("GPU", graphicsAdapter),
        formatLine("Power Management Status", batteryStatus),
        formatLine("Processor Type", nav.platform),
        formatLine("Hardware Concurrency", nav.hardwareConcurrency || ""),
        formatLine("Pointing Device Count", nav.maxTouchPoints || ""),
        formatLine("Input Peripheral List", getInputPeripherals()),
        formatLine("Sound Device Detected", getSoundDeviceStatus()),
        formatLine("Link Speed Estimate", linkSpeed),
        formatLine("Network", netType),
        formatLine("Vendor", nav.vendor),
        formatLine("Platform", nav.platform),
        formatLine("Product", nav.product),
        formatLine("System ROM", shortenAppVersion(nav.appVersion)),
        SEP,
      ];
    }

    function typewriterEffectSysinfo(element, lines, speedPerChar = 5.5, perLineDelay = 5, callback) {
      let currentLine = 0;
      function typeLine() {
        if (currentLine >= lines.length) {
          const promptLine = document.createElement('div');
          promptLine.className = "bios-sysinfoo";
          promptLine.style.marginTop = "4px";
          promptLine.style.color = "#fff";
          const promptText = "F1 to Save BIOS   |   Ctrl+Shift+R to Restart";
          const totalWidth = window.innerWidth <= 768 ? 45 : 54;
          promptLine.textContent = headerLine(promptText, totalWidth);
          element.appendChild(promptLine);

          setTimeout(() => {
            if (callback) callback();
          }, 2200);  // Give user time to see the system info before fading
          return;
        }

        let line = lines[currentLine];
        let span = document.createElement('span');
        element.appendChild(span);
        let i = 0;
        function typeChar() {
          if (i < line.length) {
            span.textContent += line[i++];
            setTimeout(typeChar, speedPerChar);
          } else {
            element.appendChild(document.createTextNode('\n'));
            currentLine++;
            setTimeout(typeLine, perLineDelay);
          }
        }
        typeChar();
      }
      typeLine();
    }

    let dotCount = 0;
    let dotInterval;

    function startDots() {
      const dotsEl = document.querySelector('.dots');
      if (!dotsEl) return;

      dotInterval = setInterval(() => {
        dotCount = (dotCount + 1) % 4;
        dotsEl.textContent = '.'.repeat(dotCount);
      }, 400);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'F1') {
        e.preventDefault();

        const biosContent = document.querySelector('.BIOS__bootHeader')?.innerText;
        if (!biosContent) return;

        const blob = new Blob([biosContent], { type: 'text/plain' });
        const downloadUrl = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = 'bios-log.txt';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        URL.revokeObjectURL(downloadUrl);
      }
    });

    function stopDots() {
      clearInterval(dotInterval);
      const dotsEl = document.querySelector('.dots');
      if (dotsEl) dotsEl.textContent = '...';
    }

    window.isShutdownSequenceActive = false;

    window.positionStartupSequencesIfReady = function () {
      console.log("Positioning function not yet available");
    };

    function hideBios() {
      const biosWrapper = document.getElementsByClassName("BIOSWrapper")[0];
      // Start fading out BIOS
      biosWrapper.classList.add("fading-out");

      // After fade completes, fully hide it
      setTimeout(() => {
        biosWrapper.classList.add("hidden");
      }, 1000);
    }

    // Cloud Shader Implementation - Direct port from Shadertoy
    const cloudShaderSource = {
      vertex: `
        attribute vec2 a_position;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `,
      fragment: `
        precision highp float;
        
        uniform vec2 iResolution;
        uniform float iTime;
        
        const float cloudscale = 1.1;
        const float speed = 0.03;
        const float clouddark = 0.5;
        const float cloudlight = 0.3;
        const float cloudcover = 0.2;
        const float cloudalpha = 8.0;
        const float skytint = 0.5;
        const vec3 skycolour1 = vec3(0.2, 0.4, 0.6);
        const vec3 skycolour2 = vec3(0.4, 0.7, 1.0);
        
        const mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
        
        vec2 hash(vec2 p) {
          p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
          return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
        }
        
        float noise(in vec2 p) {
          const float K1 = 0.366025404; // (sqrt(3)-1)/2;
          const float K2 = 0.211324865; // (3-sqrt(3))/6;
          vec2 i = floor(p + (p.x + p.y) * K1);
          vec2 a = p - i + (i.x + i.y) * K2;
          vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec2 b = a - o + K2;
          vec2 c = a - 1.0 + 2.0 * K2;
          vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
          vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
          return dot(n, vec3(70.0));
        }
        
        float fbm(vec2 n) {
          float total = 0.0, amplitude = 0.1;
          for (int i = 0; i < 7; i++) {
            total += noise(n) * amplitude;
            n = m * n;
            amplitude *= 0.4;
          }
          return total;
        }
        
        void main() {
          vec2 fragCoord = gl_FragCoord.xy;
          vec2 p = fragCoord.xy / iResolution.xy;
          vec2 uv = p * vec2(iResolution.x / iResolution.y, 1.0);
          float time = iTime * speed;
          float q = fbm(uv * cloudscale * 0.5);
          
          // ridged noise shape
          float r = 0.0;
          uv *= cloudscale;
          uv -= q - time;
          float weight = 0.8;
          for (int i = 0; i < 8; i++) {
            r += abs(weight * noise(uv));
            uv = m * uv + time;
            weight *= 0.7;
          }
          
          // noise shape
          float f = 0.0;
          uv = p * vec2(iResolution.x / iResolution.y, 1.0);
          uv *= cloudscale;
          uv -= q - time;
          weight = 0.7;
          for (int i = 0; i < 8; i++) {
            f += weight * noise(uv);
            uv = m * uv + time;
            weight *= 0.6;
          }
          
          f *= r + f;
          
          // noise colour
          float c = 0.0;
          time = iTime * speed * 2.0;
          uv = p * vec2(iResolution.x / iResolution.y, 1.0);
          uv *= cloudscale * 2.0;
          uv -= q - time;
          weight = 0.4;
          for (int i = 0; i < 7; i++) {
            c += weight * noise(uv);
            uv = m * uv + time;
            weight *= 0.6;
          }
          
          // noise ridge colour
          float c1 = 0.0;
          time = iTime * speed * 3.0;
          uv = p * vec2(iResolution.x / iResolution.y, 1.0);
          uv *= cloudscale * 3.0;
          uv -= q - time;
          weight = 0.4;
          for (int i = 0; i < 7; i++) {
            c1 += abs(weight * noise(uv));
            uv = m * uv + time;
            weight *= 0.6;
          }
          
          c += c1;
          
          vec3 skycolour = mix(skycolour2, skycolour1, p.y);
          vec3 cloudcolour = vec3(1.1, 1.1, 0.9) * clamp((clouddark + cloudlight * c), 0.0, 1.0);
          
          f = cloudcover + cloudalpha * f * r;
          
          vec3 result = mix(skycolour, clamp(skytint * skycolour + cloudcolour, 0.0, 1.0), clamp(f + c, 0.0, 1.0));
          
          gl_FragColor = vec4(result, 1.0);
        }
      `
    };

    // WebGL setup for cloud animation
    function initCloudShader() {
      const canvas = document.getElementById('cloudCanvas');
      if (!canvas) {
        console.error('Canvas not found');
        return;
      }

      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) {
        console.error('WebGL not supported');
        fallbackToGradient();
        return;
      }

      // Set canvas size
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      // Compile shaders
      function compileShader(gl, source, type) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
          gl.deleteShader(shader);
          return null;
        }

        return shader;
      }

      const vertexShader = compileShader(gl, cloudShaderSource.vertex, gl.VERTEX_SHADER);
      const fragmentShader = compileShader(gl, cloudShaderSource.fragment, gl.FRAGMENT_SHADER);

      if (!vertexShader || !fragmentShader) {
        console.error('Shader compilation failed');
        fallbackToGradient();
        return;
      }

      // Create and link program
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Program linking error:', gl.getProgramInfoLog(program));
        fallbackToGradient();
        return;
      }

      // Set up geometry (full screen quad)
      const vertices = new Float32Array([
        -1, -1,
        1, -1,
        -1, 1,
        1, 1
      ]);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

      const positionLocation = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

      // Get uniform locations
      gl.useProgram(program);
      const resolutionLocation = gl.getUniformLocation(program, 'iResolution');
      const timeLocation = gl.getUniformLocation(program, 'iTime');

      // Set viewport
      gl.viewport(0, 0, canvas.width, canvas.height);

      // Animation loop
      let startTime = Date.now();
      let animationId;

      function render() {
        // Check if we should still be rendering
        const windowsLaunch = document.querySelector('.WindowsLaunchWrapper');
        if (!windowsLaunch || windowsLaunch.classList.contains('hidden')) {
          cancelAnimationFrame(animationId);
          return;
        }

        // Resize canvas if needed
        if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);
        }

        // Clear the canvas
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        // Update uniforms
        const currentTime = (Date.now() - startTime) / 1000.0;
        gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
        gl.uniform1f(timeLocation, currentTime);

        // Draw
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        animationId = requestAnimationFrame(render);
      }

      // Start rendering
      render();

      // Store cleanup function
      window.cleanupCloudShader = () => {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
      };
    }

    // Fallback to CSS gradient if WebGL fails
    function fallbackToGradient() {
      console.log('Falling back to CSS gradient');
      const wrapper = document.querySelector('.WindowsLaunchWrapper');
      if (wrapper) {
        // Beautiful blue gradient sky
        wrapper.style.background = `linear-gradient(to bottom, 
          #1e3c72 0%,    /* Deep blue */
          #2a5298 20%,   /* Royal blue */
          #7e8ba3 50%,   /* Grayish blue (horizon) */
          #b8c6db 80%,   /* Light blue */
          #f5f7fa 100%)`;/* Almost white at bottom */
      }
    }

    function windowsLogo() {
      // Start the BIOS fade out
      hideBios();

      const windowsLaunch = document.getElementsByClassName("WindowsLaunchWrapper")[0];

      // Prepare the cloud screen (invisible at first)
      windowsLaunch.classList.add("fading-in");
      windowsLaunch.classList.remove("hidden");

      // Start fading in the cloud screen after a slight delay
      setTimeout(() => {
        windowsLaunch.classList.add("visible");

        // Initialize cloud shader once fade-in starts
        setTimeout(() => {
          initCloudShader();
        }, 50);
        windowsLaunch.classList.add("visible");

        // Initialize cloud shader once fade-in starts
        setTimeout(() => {
          initCloudShader();
        }, 100);
      }, 500);

      window.localStorage.setItem("loggedIn", "true");

      if (typeof window.positionStartupSequencesIfReady === 'function') {
        window.positionStartupSequencesIfReady();
      }

      // After display duration, fade out the cloud screen
      setTimeout(() => {
        if (window.cleanupCloudShader) {
          window.cleanupCloudShader();
        }
        windowsLaunch.classList.remove("visible");
        windowsLaunch.classList.add("hidden");
        windowsLaunch.classList.remove("fading-in");
        // Permanently remove the cloudCanvas from the DOM
        const canvas = document.getElementById('cloudCanvas');
        if (canvas && canvas.parentNode) {
          canvas.parentNode.removeChild(canvas);
        }
      }, 8000); // 8000 is 8 seconds
    }

    // Typewriter effect function
    function typewriterEffect(element, text, speed, callback) {
      let i = 0;
      element.innerHTML = '<span class="typed-text"></span><span class="typewriter-cursor"></span>';
      const typedSpan = element.querySelector('.typed-text');
      const cursorSpan = element.querySelector('.typewriter-cursor');

      function type() {
        if (i < text.length) {
          if (text.charAt(i) === '<') {
            let tagEnd = text.indexOf('>', i);
            if (tagEnd !== -1) {
              typedSpan.innerHTML += text.substring(i, tagEnd + 1);
              i = tagEnd + 1;
            } else {
              typedSpan.innerHTML += text.charAt(i);
              i++;
            }
          } else {
            typedSpan.innerHTML += text.charAt(i);
            i++;
          }
          setTimeout(type, speed);
        } else {
          cursorSpan.style.display = 'none';
          if (callback) callback();
        }
      }

      type();
    }

    function staggerElements(elems, entry) {
      if (!elems[entry]) {
        setTimeout(() => {
          const separatorLine = document.createElement('div');
          separatorLine.style.fontFamily = "'Courier New', Courier, monospace";
          separatorLine.style.color = "#d4fe6b";
          separatorLine.style.fontSize = "10.5px";
          separatorLine.style.letterSpacing = ".86px";
          separatorLine.style.lineHeight = ".89em";
          separatorLine.style.marginBottom = "4px";
          separatorLine.style.marginTop = window.innerWidth <= 768 ? "-29px" : "-11px";

          let bootContainer = document.getElementById("BIOS__bootContainer");
          bootContainer.appendChild(separatorLine);

          typewriterEffect(separatorLine, '='.repeat(window.innerWidth <= 768 ? 45 : 54), 15, function () {
            const fakeBootLine = document.createElement('div');
            fakeBootLine.innerHTML = `
              <span>Memory Status</span>
              <span style="color: #d4fe6b;">65536k</span>
              <span class="typewriter-cursor"></span>
            `;

            function countUpMemoryTest(parentElem, options = {}, onDone) {
              function getSystemMemoryEstimate() {
                if (navigator.deviceMemory) {
                  return navigator.deviceMemory * 1024 * 1024;
                }

                const cores = navigator.hardwareConcurrency || 4;
                let estimatedGB = 4;

                if (cores >= 8) estimatedGB = 16;
                else if (cores >= 6) estimatedGB = 12;
                else if (cores >= 4) estimatedGB = 8;
                else if (cores >= 2) estimatedGB = 6;

                if (/mobile|android|iphone|ipad/i.test(navigator.userAgent)) {
                  estimatedGB = Math.max(2, estimatedGB / 2);
                }

                return estimatedGB * 1024 * 1024;
              }

              function getCacheEstimate() {
                const cores = navigator.hardwareConcurrency || 4;
                let cachePerCore = 256;

                const timingPrecision = performance.timeOrigin ? 0.1 : 1;
                if (timingPrecision < 0.01) cachePerCore = 1024;
                else if (timingPrecision < 0.1) cachePerCore = 512;

                return Math.min(cores * cachePerCore, 32768);
              }

              function getAccurateStorageUsage() {
                let totalBytes = 0;

                try {
                  for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                      const value = localStorage.getItem(key) || '';
                      totalBytes += key.length + value.length;
                    }
                  }
                } catch (e) { }

                try {
                  for (let key in sessionStorage) {
                    if (sessionStorage.hasOwnProperty(key)) {
                      const value = sessionStorage.getItem(key) || '';
                      totalBytes += key.length + value.length;
                    }
                  }
                } catch (e) { }

                return Math.round(totalBytes / 1024);
              }

              function getGraphicsMemoryEstimate() {
                try {
                  const canvas = document.createElement('canvas');
                  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

                  if (!gl) return 0;

                  const maxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE);

                  if (maxTexture >= 16384) return 8192;
                  if (maxTexture >= 8192) return 4096;
                  if (maxTexture >= 4096) return 2048;
                  if (maxTexture >= 2048) return 1024;
                  return 512;

                } catch (e) {
                  return 0;
                }
              }

              function getHeapMemoryInfo() {
                if (performance.memory) {
                  return {
                    used: Math.round(performance.memory.usedJSHeapSize / 1024),
                    total: Math.round(performance.memory.totalJSHeapSize / 1024),
                    limit: Math.round(performance.memory.jsHeapSizeLimit / 1024)
                  };
                }
                return { used: 0, total: 0, limit: 0 };
              }

              const targetKB = getSystemMemoryEstimate();
              const cacheSRAM = getCacheEstimate();
              const actualStorageKB = getAccurateStorageUsage();
              const graphicsMemoryMB = getGraphicsMemoryEstimate();
              const heapInfo = getHeapMemoryInfo();

              const TOTAL_WIDTH = window.innerWidth <= 768 ? 45 : 54;

              function infoLine(label, value, suffix = "", showPassDot = false, noDots = false) {
                label = label ?? '';
                value = value == null ? '' : String(value);
                const TOTAL_WIDTH = window.innerWidth <= 768 ? 45 : 54;
                let dots = "";
                if (!noDots) {
                  const totalContentLength = label.length + 1 + value.length + (suffix ? 1 + suffix.length : 0);
                  let dotsLen = Math.max(1, TOTAL_WIDTH - totalContentLength);
                  dots = '.'.repeat(dotsLen);
                }
                let dot = showPassDot
                  ? `<span class="bios-status-dot" aria-label="pass"></span>`
                  : (suffix ? suffix : "");
                return `<span>${label}:${dots}${value}</span>${dot}`;
              }

              function animateMemoryField(parentElem, label, targetValue, unit, showPassDot, callback) {
                const div = document.createElement('div');
                div.style.cssText = `
                  font-family: 'Courier New', Courier, monospace, FixedSys, AMIBios;
                  font-size: 10.5px;
                  color: #d4fe6b;
                  margin: 0;
                  padding: 0;
                  white-space: pre;
                  letter-spacing: 0px;
                  line-height: .89em;
                  display: block;
                `;
                parentElem.appendChild(div);

                let current = 0;
                const steps = 15;
                const increment = Math.ceil(targetValue / steps);

                function updateValue() {
                  current = Math.min(current + increment, targetValue);
                  div.innerHTML = infoLine(label, current.toString() + unit, '', showPassDot && current === targetValue) +
                    (current < targetValue ? '<span class="typewriter-cursor"></span>' : '');

                  if (current < targetValue) {
                    setTimeout(updateValue, 30);
                  } else if (callback) {
                    setTimeout(callback, 100);
                  }
                }

                div.innerHTML = infoLine(label, '0' + unit, '', false) + '<span class="typewriter-cursor"></span>';
                setTimeout(updateValue, 200);
              }

              animateMemoryField(parentElem, 'System Memory', Math.round(targetKB / 1024), 'MB', true, () => {
                animateMemoryField(parentElem, 'Cache SRAM', cacheSRAM, 'KB', true, () => {
                  animateMemoryField(parentElem, 'Storage Used', actualStorageKB, 'KB', false, () => {
                    if (graphicsMemoryMB > 0) {
                      const graphicsGB = (graphicsMemoryMB / 1024).toFixed(1);
                      animateMemoryField(parentElem, 'Graphics Memory', parseFloat(graphicsGB), 'GB', false, () => {
                        if (heapInfo.used > 0) {
                          animateMemoryField(parentElem, 'Heap Used', Math.round(heapInfo.used / 1024), 'MB', false, () => {
                            animateMemoryField(parentElem, 'Heap Total', Math.round(heapInfo.total / 1024), 'MB', false, () => {
                              animateMemoryField(parentElem, 'Heap Limit', Math.round(heapInfo.limit / 1024), 'MB', false, () => {
                                if (onDone) setTimeout(onDone, 300);
                              });
                            });
                          });
                        } else if (onDone) {
                          setTimeout(onDone, 300);
                        }
                      });
                    } else if (heapInfo.used > 0) {
                      animateMemoryField(parentElem, 'Heap Used', Math.round(heapInfo.used / 1024), 'MB', false, () => {
                        animateMemoryField(parentElem, 'Heap Total', Math.round(heapInfo.total / 1024), 'MB', false, () => {
                          animateMemoryField(parentElem, 'Heap Limit', Math.round(heapInfo.limit / 1024), 'MB', false, () => {
                            if (onDone) setTimeout(onDone, 300);
                          });
                        });
                      });
                    } else if (onDone) {
                      setTimeout(onDone, 300);
                    }
                  });
                });
              });
            }

            fakeBootLine.style.fontFamily = "AMIBios, pixelmix, monospace";
            fakeBootLine.style.color = "#d4fe6b";
            fakeBootLine.style.fontSize = "10.5px";
            fakeBootLine.style.letterSpacing = ".86px";
            fakeBootLine.style.lineHeight = ".89em";
            fakeBootLine.style.marginBottom = "4px";

            countUpMemoryTest(bootContainer, {}, function () {
              const sysinfoContainer = document.createElement('pre');
              sysinfoContainer.className = "bios-sysinfo";
              bootContainer.appendChild(sysinfoContainer);

              const infoLines = getSystemFields();
              typewriterEffectSysinfo(sysinfoContainer, infoLines, 8, 50, windowsLogo);
            });
          });
        }, 500);
        return;
      }

      const currentElem = elems[entry];
      currentElem.classList.add("visible");

      if (currentElem.classList.contains('BIOS__logo')) {
        setTimeout(() => staggerElements(elems, entry + 1), 500);
        return;
      }

      const originalHTML = currentElem.innerHTML;
      typewriterEffect(currentElem, originalHTML, 30, () => {
        setTimeout(() => staggerElements(elems, entry + 1), 300);
      });
    }

    function loadScreen() {
      var biosElem = document.querySelector(".BIOS");
      

      const pathname = window.location.pathname;
      const isSubdirectory = pathname !== '/' && pathname !== '/index.html' && pathname !== '';

      if (window.localStorage.getItem("loggedIn") || isSubdirectory) {
        hideBios();
        if (isSubdirectory) {
          const windowsLaunch = document.getElementsByClassName("WindowsLaunchWrapper")[0];
          if (windowsLaunch) {
            windowsLaunch.classList.add("hidden");
          }
        }
        return;
      }

      biosElem.classList.add("visible");

      if (typeof window.positionStartupSequencesIfReady === 'function') {
        window.positionStartupSequencesIfReady();
      }

      initHoldToSkip();
      startDots();
      staggerElements(biosElem.getElementsByTagName("div"), 0);
    }

    function setupShutdownDetection() {
      const shutdownObserver = new MutationObserver((mutations) => {
        const biosWrapper = document.querySelector(".BIOSWrapper");
        const windowsLaunchWrapper = document.querySelector(".WindowsLaunchWrapper");
        const desktop = document.querySelector(".desktop");
        const shutdownScreen = document.querySelector(".itIsNowSafeToTurnOffYourComputer");

        let sequenceActive = false;

        if (biosWrapper && windowsLaunchWrapper) {
          const biosStyles = getComputedStyle(biosWrapper);
          const windowsStyles = getComputedStyle(windowsLaunchWrapper);

          const biosVisible = !biosWrapper.classList.contains("hidden") &&
            biosStyles.opacity !== "0" &&
            biosStyles.visibility !== "hidden" &&
            biosStyles.display !== "none";

          const windowsVisible = !windowsLaunchWrapper.classList.contains("hidden") &&
            windowsStyles.opacity !== "0" &&
            windowsStyles.visibility !== "hidden" &&
            windowsStyles.display !== "none";

          const biosTransitioning = parseFloat(biosStyles.opacity) > 0 ||
            biosWrapper.style.opacity === "1" ||
            biosWrapper.classList.contains("visible");

          const windowsTransitioning = parseFloat(windowsStyles.opacity) > 0 ||
            windowsLaunchWrapper.style.opacity === "1" ||
            windowsLaunchWrapper.classList.contains("visible");

          sequenceActive = biosVisible || windowsVisible || biosTransitioning || windowsTransitioning;
        }

        if (desktop && desktop.classList.contains("windowsShuttingDown")) {
          sequenceActive = true;
        }

        if (shutdownScreen) {
          sequenceActive = true;
        }

        const wasShutdownActive = window.isShutdownSequenceActive;
        window.isShutdownSequenceActive = sequenceActive;

        if (wasShutdownActive !== window.isShutdownSequenceActive) {
          window.dispatchEvent(new CustomEvent('shutdownStateChanged', {
            detail: { isActive: window.isShutdownSequenceActive }
          }));

          if (window.isShutdownSequenceActive) {
            document.body.classList.add("startup-sequence-active");
            document.body.classList.add("shutdown-sequence-active");
          } else {
            document.body.classList.remove("startup-sequence-active");
            document.body.classList.remove("shutdown-sequence-active");
          }
        }
      });

      const biosWrapper = document.querySelector(".BIOSWrapper");
      const windowsLaunchWrapper = document.querySelector(".WindowsLaunchWrapper");
      const desktop = document.querySelector(".desktop");

      if (biosWrapper) {
        shutdownObserver.observe(biosWrapper, {
          attributes: true,
          attributeFilter: ['class', 'style'],
          subtree: true
        });

        if (biosWrapper.parentElement) {
          shutdownObserver.observe(biosWrapper.parentElement, {
            attributes: true,
            attributeFilter: ['class', 'style'],
            childList: true
          });
        }
      }

      if (windowsLaunchWrapper) {
        shutdownObserver.observe(windowsLaunchWrapper, {
          attributes: true,
          attributeFilter: ['class', 'style'],
          subtree: true
        });

        if (windowsLaunchWrapper.parentElement) {
          shutdownObserver.observe(windowsLaunchWrapper.parentElement, {
            attributes: true,
            attributeFilter: ['class', 'style'],
            childList: true
          });
        }
      }

      if (desktop) {
        shutdownObserver.observe(desktop, {
          attributes: true,
          attributeFilter: ['class'],
          subtree: false
        });
      }

      shutdownObserver.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class']
      });

      setInterval(() => {
        const biosWrapper = document.querySelector(".BIOSWrapper");
        const windowsLaunchWrapper = document.querySelector(".WindowsLaunchWrapper");
        const desktop = document.querySelector(".desktop");
        const shutdownScreen = document.querySelector(".itIsNowSafeToTurnOffYourComputer");

        let sequenceActive = false;

        if (biosWrapper && windowsLaunchWrapper) {
          const biosStyles = getComputedStyle(biosWrapper);
          const windowsStyles = getComputedStyle(windowsLaunchWrapper);

          const biosActive = (!biosWrapper.classList.contains("hidden") &&
            biosStyles.opacity !== "0") ||
            parseFloat(biosStyles.opacity) > 0;

          const windowsActive = (!windowsLaunchWrapper.classList.contains("hidden") &&
            windowsStyles.opacity !== "0") ||
            parseFloat(windowsStyles.opacity) > 0;

          sequenceActive = biosActive || windowsActive;
        }

        if (desktop && desktop.classList.contains("windowsShuttingDown")) {
          sequenceActive = true;
        }

        if (shutdownScreen) {
          sequenceActive = true;
        }

        const wasShutdownActive = window.isShutdownSequenceActive;
        window.isShutdownSequenceActive = sequenceActive;

        if (wasShutdownActive !== window.isShutdownSequenceActive) {
          window.dispatchEvent(new CustomEvent('shutdownStateChanged', {
            detail: { isActive: window.isShutdownSequenceActive }
          }));

          if (window.isShutdownSequenceActive) {
            document.body.classList.add("startup-sequence-active");
            document.body.classList.add("shutdown-sequence-active");
          } else {
            document.body.classList.remove("startup-sequence-active");
            document.body.classList.remove("shutdown-sequence-active");
          }
        }
      }, 1000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(setupShutdownDetection, 100);
      });
    } else {
      setTimeout(setupShutdownDetection, 100);
    }

    setTimeout(loadScreen, 1500);
  </script>
